# Example reverse proxy server block (adapt to your existing VM Nginx/Caddy proxy).
# TLS terminates at your existing proxy (e.g. Certbot/Let's Encrypt).

server {
    listen 443 ssl http2;
    server_name app.worktrack.example.co.za;

    # ssl_certificate /etc/letsencrypt/live/app.worktrack.example.co.za/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.worktrack.example.co.za/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}