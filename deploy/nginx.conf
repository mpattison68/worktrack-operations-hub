# Example Nginx reverse proxy config for WorkTrack (app + self-hosted Supabase API).
# Adapt server_name, certificate paths, and upstream ports to match your VM.
# Keep PostgreSQL (5432) and Supabase Studio bound to 127.0.0.1 only — never proxy them publicly.

server {
    listen 443 ssl http2;
    server_name app.worktrack.example.co.za;

    # ssl_certificate /etc/letsencrypt/live/app.worktrack.example.co.za/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.worktrack.example.co.za/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    # Ensure PWA service worker updates are fetched fresh
    location = /sw.js {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Self-hosted Supabase Kong API Gateway (Auth, PostgREST, Storage)
# Update upstream port (default 8000, or your chosen localhost port such as 8400)
server {
    listen 443 ssl http2;
    server_name api.worktrack.example.co.za;

    # ssl_certificate /etc/letsencrypt/live/api.worktrack.example.co.za/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.worktrack.example.co.za/privkey.pem;

    # Match WorkTrack's 10 MB attachment limit with headroom
    client_max_body_size 15m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}